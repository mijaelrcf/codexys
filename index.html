<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Codexys — Mejores soluciones. Desarrollo de software a medida y aplicaciones web modernas." />
    <meta name="theme-color" content="#05070F" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Codexys — Desarrollo de Software a Medida" />
    <meta property="og:description" content="Diseño, desarrollo y despliegue de aplicaciones web modernas. Proceso ágil, código limpio y mejores soluciones para tu negocio." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="Codexys — Mejores Soluciones" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Codexys — Desarrollo de Software a Medida" />
    <meta name="twitter:description" content="Diseño, desarrollo y despliegue de aplicaciones web modernas. Proceso ágil, código limpio y mejores soluciones para tu negocio." />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Codexys — Mejores Soluciones</title>
    <script>
      try {
        var stored = localStorage.getItem("codexys-theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
